<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171b16">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Привычки">
<title>Трекер привычек</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<link rel="stylesheet" href="./styles.css">
<script type="module" src="./app.js"></script>
</head>
<body>
<div class="app-shell">
<main id="app" class="screen" tabindex="-1"></main>
<button id="quick" class="fab" data-action="new" type="button" aria-label="Добавить привычку"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
<nav id="tabs" class="tabbar" aria-label="Основная навигация"></nav>
</div>
<dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript>Для работы трекера включите JavaScript в настройках браузера.</noscript>
</body>
</html>
